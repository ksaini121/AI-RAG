[project]
name = "python-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
    "pyjwt>=2.14.0",
    "bcrypt>=5.0.0",
    "langchain>=1.4.2",
    "langgraph>=1.2.12",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "temporalio>=1.33.0",
    "sse-starlette>=3.4.11",
    "python-multipart>=0.0.32",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "starlette>=1.6.0",
    "langchain-core>=1.6.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.pytest.ini_options]
# `src/` layout: make `import app...` work without installing the package.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
# Teaches mypy that pydantic-settings fields are populated from the environment,
# so `Config()` with no arguments type-checks correctly.
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
